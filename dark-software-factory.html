<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" class="visually-hidden" multiple accept=".pdf,.doc,.docx,.txt,.md,.json,.yaml,.yml,.png,.jpg,.jpeg,.webp,.zip" aria-label="Chọn file đính kèm">
<script>
(()=>{
'use strict';
const $=(q,root=document)=>root.querySelector(q), $$=(q,root=document)=>[...root.querySelectorAll(q)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const size=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;
const examples=[
'Tạo ứng dụng quản lý công việc cho nhóm 10 người, đăng nhập Google, giao diện tiếng Việt, lưu dữ liệu PostgreSQL và triển khai trên VPS.',
'Xây dựng landing page cho thương hiệu, có form nhận khách hàng tiềm năng, SEO cơ bản và tự động deploy từ GitHub.',
'Tạo REST API quản lý sản phẩm và đơn hàng, PostgreSQL, Docker, unit tests và môi trường staging.'
];
const state={scenario:'',route:'new',goal:'',name:'',settingsOpen:false,source:'new',repo:'',branch:'main',files:[],env:'staging',stack:'Next.js + PostgreSQL',provider:'DigitalOcean',db:true,domain:true,monitor:true,budget:100,tests:true,approvalProduction:true,approvalCost:true,approvalExternal:true,approvalMigration:true,allowed:false,plan:null,expanded:0,runIndex:-1,running:false,paused:false,logs:[],timer:null};
const view=$('#view'), fileInput=$('#fileInput');let toastTimer=null;
function notify(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3400)}
function navigate(route){if(route==='plan'&&!state.plan){notify('Hãy tạo Execution Plan từ mục tiêu của bạn trước.');route='new'}if(route==='run'&&!state.plan){notify('Chưa có execution nào — hãy tạo plan trước.');route='new'}if(state.route==='run'&&route!=='run'&&state.running)pauseTimer();state.route=route;draw();window.scrollTo(0,0)}
function head(eyebrow,title,desc,right=''){return `<header class="page-head"><div><div class="eyebrow">✦ ${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${right?`<div class="head-side">${right}</div>`:''}</header>`}
function strip(stage){return `<div class="steps-strip" aria-label="Tiến trình tạo dự án">${[['new','01','Mô tả mục tiêu'],['plan','02','Duyệt kế hoạch'],['run','03','Thực thi']].map(([key,num,label],i)=>`${i?'<span class="sep"></span>':''}<span class="part ${stage===key?'active':(stage==='plan'&&i===0)||(stage==='run'&&i<2)?'done':''}"><span class="bubble">${(stage==='plan'&&i===0)||(stage==='run'&&i<2)?'✓':num}</span>${label}</span>`).join('')}</div>`}
function panel(title,icon,body,tail=''){return `<section class="panel"><div class="panel-head"><h2><span class="icon">${icon}</span>${title}</h2>${tail}</div>${body}</section>`}
function sourceDetails(){return state.source==='github'?`<div class="github-fields" role="group" aria-label="Thông tin GitHub"><div class="field"><label class="input-label" for="repo">Đường dẫn repository</label><input class="input" id="repo" type="url" inputmode="url" autocomplete="url" placeholder="https://github.com/owner/repo" value="${esc(state.repo)}"><p class="help">Chỉ nhập URL công khai, không nhập access token.</p></div><div class="field"><label class="input-label" for="branch">Branch</label><input id="branch" class="input" value="${esc(state.branch)}" placeholder="main"></div></div>`:''}
function attachments(){return state.files.map((f,i)=>`<div class="attachment"><span class="fname">📄 ${esc(f.name)} <span class="muted">(${size(f.size)})</span></span><button data-remove="${i}" type="button" aria-label="Xóa ${esc(f.name)}">×</button></div>`).join('')}
const scenarios=[
 {id:'new',title:'✦ Tạo ứng dụng',desc:'Tạo mới · staging'},
 {id:'github',title:'⑂ GitHub có sẵn',desc:'Dùng repository'},
 {id:'prod',title:'⚡ Deploy production',desc:'Có bước phê duyệt'},
 {id:'budget',title:'⚠ Budget quá thấp',desc:'Kiểm tra chặn thực thi'}
];
function scenarioMarkup(){if(!new URLSearchParams(location.search).has('qa'))return '';return `<section class="scenario-lab" aria-label="Các kịch bản mô phỏng"><div><b>Thử nhanh các tình huống sử dụng</b><p>Chọn kịch bản để nạp dữ liệu ví dụ, rồi tự thay đổi và tạo kế hoạch. Dữ liệu chỉ tồn tại trong tab này.</p></div><div class="scenario-options">${scenarios.map(s=>`<button type="button" data-scenario="${s.id}" class="scenario-chip ${state.scenario===s.id?'selected':''}" aria-pressed="${state.scenario===s.id}"><strong>${s.title}</strong><small>${s.desc}</small></button>`).join('')}</div></section>`}
function applyScenario(id){
 const preset={name:'taskflow-app',goal:examples[0],source:'new',repo:'',branch:'main',env:'staging',stack:'Next.js + PostgreSQL',provider:'DigitalOcean',db:true,domain:true,monitor:true,budget:100,tests:true,approvalProduction:true};
 const overrides={
  new:{},
  github:{name:'team-portal',goal:'Phân tích dự án GitHub này, chạy build và kiểm thử, cấu hình PostgreSQL và triển khai bản cập nhật lên staging.',source:'github',repo:'https://github.com/example/team-portal',branch:'main'},
  prod:{name:'production-store',goal:'Triển khai website bán hàng có cơ sở dữ liệu PostgreSQL, HTTPS, backup và hệ thống giám sát lên production.',env:'production',provider:'Hetzner',budget:90},
  budget:{name:'low-budget-app',goal:'Tạo ứng dụng nội bộ quản lý công việc, database PostgreSQL và giám sát tự động trong môi trường staging.',env:'staging',budget:12}
 };
 if(!overrides[id])return;
 pauseTimer();Object.assign(state,preset,overrides[id],{files:[],scenario:id,settingsOpen:(id==='prod'||id==='budget'),plan:null,allowed:false,expanded:0,runIndex:-1,logs:[]});
 navigate('new');notify(`Đã nạp kịch bản: ${scenarios.find(s=>s.id===id).title}.`);
}
function draftSummary(){return `<div class="preview-hero"><div class="orb">✧</div><h3>${esc(state.name||'Untitled project')}</h3><p>${esc(state.goal.trim().slice(0,144)||'Mô tả mục tiêu để bắt đầu tạo project.')}${state.goal.trim().length>144?'…':''}</p></div><div class="checklist"><div class="ck"><span class="check">✓</span> AI phân tích yêu cầu và đề xuất kiến trúc</div><div class="ck"><span class="check">✓</span> Tạo Execution Plan với các bước có thể kiểm tra</div><div class="ck"><span class="check">✓</span> Ước lượng tài nguyên, chi phí và quyền hạn</div><div class="ck"><span class="check">✓</span> Chỉ thực thi sau khi bạn phê duyệt</div></div><div class="divider" style="margin:5px 0"></div><div class="data-row"><span>Nguồn</span><strong>${state.source==='github'?'GitHub repository':'Tạo mới bằng AI'}</strong></div><div class="data-row"><span>Môi trường</span><strong>${esc(state.env)}</strong></div><div class="data-row"><span>Tech stack</span><strong>${esc(state.stack)}</strong></div><div class="data-row"><span>Tài liệu</span><strong>${state.files.length} tệp</strong></div><div class="hint" style="margin-top:14px">🔒 File chỉ được chọn và xem tên trong trình duyệt. Prototype không tải file lên máy chủ.</div>`}
function welcomeSettings(){return `<details class="welcome-options" id="advancedOptions" ${state.settingsOpen?'open':''}><summary><span>⚙ Tùy chọn dự án</span><span class="muted tiny">Không bắt buộc</span></summary><div class="options-content">
<div class="field-grid"><div class="field"><label class="input-label" for="projectName">Tên dự án</label><input class="input" id="projectName" value="${esc(state.name)}" maxlength="60" placeholder="Tự tạo từ mô tả"></div><div class="field"><label class="input-label" for="env">Môi trường</label><select id="env" class="select"><option value="development" ${state.env==='development'?'selected':''}>Development</option><option value="staging" ${state.env==='staging'?'selected':''}>Staging</option><option value="production" ${state.env==='production'?'selected':''}>Production</option></select></div></div>
<div class="field-grid"><div class="field"><label class="input-label" for="provider">Hạ tầng</label><select id="provider" class="select">${['DigitalOcean','Hetzner','VPS riêng','Chọn sau'].map(x=>`<option ${state.provider===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="input-label" for="stack">Công nghệ</label><select id="stack" class="select">${['AI đề xuất','Next.js + PostgreSQL','React + Node.js + PostgreSQL','Vue + FastAPI + PostgreSQL'].map(x=>`<option ${state.stack===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
<div class="field"><label class="input-label" for="budget">Ngân sách tối đa / tháng (USD)</label><input class="input" type="number" min="1" max="1000000" id="budget" value="${state.budget}"></div>
<div class="welcome-toggles"><label class="toggle-row"><span><strong>Cơ sở dữ liệu</strong><small>PostgreSQL và backup</small></span><input id="db" type="checkbox" ${state.db?'checked':''}></label><label class="toggle-row"><span><strong>Domain + HTTPS</strong><small>DNS và SSL</small></span><input id="domain" type="checkbox" ${state.domain?'checked':''}></label><label class="toggle-row"><span><strong>Giám sát</strong><small>Health check và logs</small></span><input id="monitor" type="checkbox" ${state.monitor?'checked':''}></label><label class="toggle-row"><span><strong>Chạy kiểm thử</strong><small>Build và test trước khi deploy</small></span><input id="tests" type="checkbox" ${state.tests?'checked':''}></label><label class="toggle-row"><span><strong>Phê duyệt production</strong><small>Xác nhận trước khi thay đổi production</small></span><input id="approvalProduction" type="checkbox" ${state.approvalProduction?'checked':''}></label></div>
</div></details>`}
function newPage(){return `<div class="welcome-screen">
<div class="welcome-symbol" aria-hidden="true">✦</div>
<p class="welcome-kicker">TỪ Ý TƯỞNG ĐẾN SẢN PHẨM</p>

<p class="welcome-description">Mô tả ý tưởng bằng ngôn ngữ tự nhiên. Factory sẽ đề xuất các bước, tài nguyên và chi phí để bạn xem trước khi chạy.</p>
<section class="compose-card" id="dropzone" aria-label="Mô tả dự án mới">
<label class="visually-hidden" for="goal">Mô tả yêu cầu của bạn</label>
<textarea class="welcome-goal" id="goal" maxlength="5000" placeholder="Ví dụ: Xây một ứng dụng quản lý công việc cho nhóm, có đăng nhập Google, PostgreSQL và triển khai lên VPS…">${esc(state.goal)}</textarea>
<div id="sourceDetails">${sourceDetails()}</div>
<div class="attachment-list" id="attachmentList">${attachments()}</div>
<div class="composer-bottom"><div class="compose-tools"><button type="button" id="attachFiles" class="tool-button" title="Thêm tài liệu">＋ <span>Tài liệu</span></button><button type="button" class="tool-button ${state.source==='github'?'selected':''}" data-source="github" aria-pressed="${state.source==='github'}" title="Dùng repository GitHub">⑂ <span>GitHub</span></button></div><button class="btn primary strong composer-submit" id="generate">Tạo kế hoạch <span aria-hidden="true">→</span></button></div>

function estimate(){const base={development:13,staging:22,production:32}[state.env]||22;const monthly=base+(state.db?8:0)+(state.domain?2:0)+(state.monitor?5:0);const once=3.2+(state.source==='github'?1.5:2)+(state.tests?0.9:0);const secs=state.source==='github'?32:43;return {monthly,once,mins:secs,resources:3+Number(state.db)+Number(state.domain)+Number(state.monitor)+(state.source==='github'?1:0)}}

}
function attachRemovers(){$$('[data-remove]').forEach(b=>b.onclick=()=>{state.files.splice(Number(b.dataset.remove),1);$('#attachmentList').innerHTML=attachments();attachRemovers();refreshDraft()})}
function addFiles(fs){const types=/\.(pdf|docx?|txt|md|json|ya?ml|png|jpe?g|webp|zip)$/i;let accepted=0;for(const f of fs){if(state.files.length>=5){notify('Tối đa 5 tệp đính kèm.');break}if(f.size>10*1024*1024){notify(`${f.name}: vượt giới hạn 10 MB.`);continue}if(!types.test(f.name)){notify(`${f.name}: định dạng chưa được hỗ trợ.`);continue}if(state.files.some(x=>x.name===f.name&&x.size===f.size))continue;state.files.push(f);accepted++}if(accepted)notify(`Đã thêm ${accepted} tài liệu (chỉ trên thiết bị).`);const cont=$('#attachmentList');if(cont){cont.innerHTML=attachments();attachRemovers()}refreshDraft()}
fileInput.onchange=e=>{addFiles([...e.target.files]);fileInput.value=''};
function showFieldError(msg,id){notify(msg);const field=$('#'+id);const banner=$('#formError');if(banner){banner.textContent='⚠ '+msg;banner.classList.remove('hidden')}if(field){field.setAttribute('aria-invalid','true');field.scrollIntoView({behavior:'smooth',block:'center'});try{field.focus({preventScroll:true})}catch(e){field.focus()}}}
function slugFor(value){return value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40).replace(/-$/,'')||'new-project'}
function generate(){if(state.goal.trim().length<20){showFieldError('Hãy mô tả mục tiêu chi tiết hơn (ít nhất 20 ký tự).','goal');return}if(state.source==='github'&&!/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+(?:\.git)?\/?(?:\?.*)?$/.test(state.repo.trim())){showFieldError('Vui lòng nhập URL GitHub repo hợp lệ.','repo');return}if(state.source==='github'&&!state.branch.trim()){showFieldError('Hãy nhập branch GitHub.','branch');return}if(!Number.isFinite(state.budget)||state.budget<1){state.settingsOpen=true;draw();showFieldError('Budget cap phải là số dương.','budget');return}if(!state.name.trim())state.name=slugFor(state.goal);state.plan=makePlan();state.expanded=0;state.allowed=false;pauseTimer();navigate('plan');notify('Execution Plan đã được tạo tại trình duyệt (demo).')}
function pauseTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}state.running=false;state.paused=false}
function resetRun(){pauseTimer();state.runIndex=-1;state.logs=[];state.expanded=-1;draw();notify('Đã reset execution demo.')}
function tick(){if(!state.plan)return;if(state.runIndex>=state.plan.steps.length){pauseTimer();runtimeLog('Mô phỏng hoàn thành. Không có deploy hoặc chi phí thực tế.',true);draw();return}const step=state.plan.steps[state.runIndex];runtimeLog(`Hoàn tất giả lập: ${step.title}`,true);state.runIndex++;if(state.runIndex>=state.plan.steps.length){pauseTimer();runtimeLog('Kết thúc mô phỏng. Không có hành động ngoài trình duyệt.',true)}draw()}
function toggleRun(){if(state.running){if(state.paused){state.paused=false;runtimeLog('Tiếp tục mô phỏng.');state.timer=setInterval(tick,1000)}else{clearInterval(state.timer);state.timer=null;state.paused=true;runtimeLog('Tạm dừng mô phỏng.')}draw();return}if(state.runIndex>=state.plan.steps.length||state.runIndex<0){state.runIndex=0;state.logs=[]}state.running=true;state.paused=false;runtimeLog('Bắt đầu mô phỏng execution. Không kết nối provider.');state.timer=setInterval(tick,1000);draw()}
$$('[data-route]').forEach(b=>b.onclick=()=>navigate(b.dataset.route));draw();
})();
</script>
</body>
</html>
