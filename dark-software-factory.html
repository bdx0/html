;padding:11px 26px;border-bottom:1px solid #1e2b40}.thread-title{font-weight:700;font-size:12px;color:#d7e2f7;display:flex;gap:9px;align-items:center;min-width:0}.thread-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.back-link{background:none;color:#9cbcf5;border:0;font-size:12px;padding:5px}.tabs{display:flex;gap:5px}.tab{border:1px solid transparent;background:transparent;color:#90a1b7;padding:7px 11px;border-radius:8px;font-size:11px}.tab.current{background:#213250;border-color:#324e7d;color:#dce7ff}.stage.plan-stage{padding:27px max(22px,calc((100% - 900px)/2)) 75px}.plan-head{display:flex;gap:15px;align-items:start;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}.plan-head h2{font-size:23px;margin:0 0 6px;letter-spacing:-.04em}.plan-head p{margin:0;color:var(--muted);font-size:12px}.plan-pill{font-size:10px;padding:5px 10px;border-radius:20px;border:1px solid #476158;color:#8ce9c0;background:#19392d}.plan-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(245px,.8fr);align-items:start;gap:16px}.panel{background:#121d2e;border:1px solid #2c3b52;border-radius:16px;min-width:0;overflow:hidden;margin-bottom:15px}.panel h3{font-size:13px;margin:0;padding:15px 17px;border-bottom:1px solid #2a394f}.panel-body{padding:16px 17px}.plan-step{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #26364b}.plan-step:last-child{border-bottom:0}.n{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;flex:none;background:#263961;color:#b6d6ff;font-size:11px;font-weight:800}.plan-step b{font-size:12px}.plan-step small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.rowitem{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #28364b;color:#a9bdd5;font-size:11px}.rowitem:last-child{border:0}.rowitem strong{color:#e3edfd;text-align:right;overflow-wrap:anywhere}.big-num{font-size:27px;letter-spacing:-.05em;font-weight:800}.note{border:1px solid #3e4b65;background:#1a2840;border-radius:11px;padding:11px;color:#b5c8e0;font-size:11px;line-height:1.65}.budget-edit{display:grid;gap:6px;margin:12px 0}.budget-edit label{font-size:11px;color:#cbd9ed;font-weight:700}.budget-edit input{background:#0c1523;color:#f2f6ff;border:1px solid #435371;border-radius:9px;padding:10px 12px;width:100%}.checkbox-line{display:flex;align-items:flex-start;gap:10px;margin:16px 0;font-size:11px;color:#bacbe3}.checkbox-line input{margin-top:3px;accent-color:#969eff;width:17px;height:17px;flex:none}.warning{color:#ffcc88;font-size:11px;margin:9px 0}.log{font:11px/1.8 ui-monospace,Menlo,Consolas,monospace;color:#a6d0f5;padding:5px 0;border-bottom:1px solid #263449;overflow-wrap:anywhere}.progress{height:8px;background:#273950;border-radius:50px;overflow:hidden;margin:15px 0}.progress div{height:100%;background:linear-gradient(90deg,#7ca7ff,#aa8bff);transition:width .2s}.soft-tag{font-size:10px;padding:4px 8px;border-radius:8px;background:#223852;color:#9cbde8}.mobile-overlay{display:none}#filePicker{display:none}

<body>
<div id="app"></div>
<input type="file" id="filePicker" multiple accept=".txt,.md,.pdf,.doc,.docx,.json,.csv,.png,.jpg,.jpeg,.webp" aria-label="Đính kèm tài liệu">
<script>
(()=>{'use strict';
const KEY='dark-factory-chat-v07';
const STEPS=[['Phân tích yêu cầu','Kiểm tra phạm vi, rủi ro và đầu vào'],['Lập kiến trúc','Chia công việc thành các phần độc lập'],['Chuẩn bị mã nguồn','Sinh/chỉnh sửa code và cấu hình'],['Kiểm thử','Build, test và kiểm tra an toàn'],['Chuẩn bị tài nguyên','Dự trù môi trường và chi phí'],['Triển khai & xác minh','Triển khai, kiểm tra sức khỏe và báo cáo']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,7);
const initial=()=>({version:7,active:'main',threads:[{id:'main',title:'Thread chính',parent:null,messages:[],kind:'main'}],drafts:{},attachments:[],github:'',githubOpen:false,drawer:false,error:'',nextFocus:false});
let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null');if(s?.version!==7||!Array.isArray(s.threads)||!s.threads.some(t=>t.id==='main'))s=initial()}catch(e){s=initial()}
// Store only demo text and file metadata; uploaded bytes are never saved or sent anywhere.
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...s,drawer:false,nextFocus:false,attachments:[]}))}catch(e){}};
const thread=()=>s.threads.find(t=>t.id===s.active)||s.threads[0];
const find=id=>s.threads.find(t=>t.id===id);
const msg=(role,content,extra={})=>({id:id(),role,content,...extra});
const titleFrom=text=>text.trim().replace(/\s+/g,' ').slice(0,43)+(text.trim().length>43?'…':'');
const isProject=text=>/\b(app|saas|api|backend|frontend|website|webapp|dashboard|server|microservice|database|docker|kubernetes|github|repo|vps|p[aà]as)\b|ứng dụng|phần mềm|trang web|website|hệ thống|cơ sở dữ liệu|triển khai/i.test(text);
const complex=text=>{const a=text.toLowerCase();
  const asks=/\b(build|deploy|migrate|implement|develop|refactor|architecture|pipeline|infrastructure|automate)\b|xây dựng|lập trình|phát triển|triển khai|tích hợp|cấp phát|di chuyển dữ liệu|tự động hoá|tự động hóa|thiết kế.*(ứng dụng|web|hệ thống)|tạo.*(ứng dụng|app|website|trang web|hệ thống|api|saas|phần mềm)|sửa.*(repository|repo|toàn bộ dự án)/i.test(a);
  const longMulti=a.length>240&&/(sau đó|tiếp theo|đồng thời|kết nối|bao gồm|cùng với)/.test(a);
  return asks||longMulti||(!!s.github&&/code|repo|chỉnh sửa|phân tích dự án/i.test(a));
};
const shortAnswer=text=>{const a=text.toLowerCase();
  if(/email|thư mời|tin nhắn|thư trả lời/.test(a)&&/(viết|soạn|draft|giúp)/.test(a))return 'Đây là yêu cầu có thể xử lý ngay trong thread chính.\n\n[Mô phỏng] Bản hoàn chỉnh sẽ được tạo trực tiếp tại đây sau khi kết nối AI, không cần khởi tạo Project.';
  if(/tóm tắt|summarize/.test(a))return 'Đây là tác vụ ngắn nên ở lại thread chính.\n\n[Mô phỏng] Khi có AI backend, nội dung tóm tắt sẽ xuất hiện ngay trong cuộc trò chuyện này.';
  return 'Yêu cầu này có thể được xử lý trực tiếp trong thread chính, không cần tạo Project hay quy trình thực thi riêng.\n\n[Mô phỏng giao diện] Phản hồi AI thực tế sẽ xuất hiện tại đây sau khi kết nối backend.';
};
function send(){const el=document.querySelector('#messageInput');const text=(el?.value||'').trim();if(!text){s.error='Hãy nhập điều bạn muốn thực hiện.';render();return}
 if(s.githubOpen&&s.github&&!/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+(?:\/[^\s]*)?$/i.test(s.github.trim())){s.error='Đường dẫn GitHub không hợp lệ. Ví dụ: https://github.com/owner/repo';render();return}
 const t=thread();t.messages.push(msg('user',text,{files:s.attachments.map(f=>f.name),github:s.github||''}));s.drafts[t.id]='';s.error='';
 if(t.kind==='main'&&complex(text)){
   const childId=id(),eligible=isProject(text),c={id:childId,title:titleFrom(text),kind:'child',parent:'main',eligible,source:text,messages:[msg('user',text,{files:s.attachments.map(f=>f.name),github:s.github||''}),msg('assistant',eligible?'Đây là công việc nhiều bước. Tôi đã tách thành thread con để lập kế hoạch, theo dõi và phản hồi mà không làm rối thread chính.\n\nBạn có thể trao đổi thêm trước khi tạo Project.':'Công việc có nhiều bước nên được xử lý trong thread con. Bạn có thể tiếp tục làm rõ mục tiêu trước khi lập Execution Plan.')],tab:'chat',plan:null};
   s.threads.push(c);t.messages.push(msg('assistant','Công việc này đã được chuyển sang thread con để xử lý riêng. Thread chính vẫn dành cho các yêu cầu nhanh.',{childId}));s.active=childId;
 }else if(t.kind==='main'){t.messages.push(msg('assistant',shortAnswer(text),{simple:true}))}
 else{t.messages.push(msg('assistant','Tôi đã nhận thêm yêu cầu trong thread con. [Mô phỏng] Khi có AI backend, kế hoạch và tác vụ sẽ được cập nhật dựa trên trao đổi này.'));if(t.plan&&t.plan.status==='draft'){t.plan.confirmed=false}}
 s.attachments=[];s.github='';s.githubOpen=false;s.nextFocus=true;save();render();}
function addProject(){const t=thread();if(t.kind!=='child')return;t.plan={id:id(),status:'draft',isProject:t.eligible,cap:50,monthly:28,once:3.5,confirmed:false,step:0,paused:false,logs:[]};t.tab='plan';t.messages.push(msg('assistant',t.eligible?'Đã tạo Project nháp và Execution Plan mẫu. Hãy kiểm tra ngân sách, tài nguyên và quyền phê duyệt trước khi chạy.':'Đã tạo Execution Plan để theo dõi các bước xử lý.'));save();render();}
function approve(){const p=thread().plan;if(!p||p.status!=='draft'||!p.confirmed||p.cap<(p.monthly+p.once))return;p.status='running';p.logs=['[DEMO] Đã phê duyệt kế hoạch. Chưa có hành động thực trên server.'];save();render();}
function nextStep(){const p=thread().plan;if(!p||p.status!=='running'||p.paused)return;p.logs.push(`[DEMO] Hoàn thành: ${STEPS[p.step][0]}.`);p.step++;if(p.step>=STEPS.length){p.status='done';thread().messages.push(msg('assistant','Luồng mô phỏng đã hoàn tất. Không có tài nguyên hoặc phần mềm thật được tạo ra.'))}save();render();}
const attrs=f=>`title="${esc(f)}"`;
function composer(isWelcome){const draft=s.drafts[s.active]||'';return `<div class="composer-wrap"><div class="composer"><textarea id="messageInput" maxlength="6000" aria-label="Bạn muốn điều gì?" placeholder="Nhập điều bạn muốn..." rows="${isWelcome?3:2}">${esc(draft)}</textarea><div class="extras">${s.githubOpen?`<input id="githubInput" class="repo-input" aria-label="GitHub repository (tùy chọn)" value="${esc(s.github)}" placeholder="https://github.com/owner/repo">`:''}${s.attachments.length?`<div class="attached">${s.attachments.map((f,i)=>`<span class="file-chip"><span>📎 ${esc(f.name)}</span><button data-action="remove-file" data-index="${i}" aria-label="Xóa tệp">×</button></span>`).join('')}</div>`:''}</div><div class="compose-bottom"><div class="tools"><button class="toolbtn" type="button" data-action="files" aria-label="Đính kèm tệp">＋ Tệp</button><button class="toolbtn ${s.githubOpen?'active':''}" type="button" data-action="github">⌘ GitHub</button></div><button class="send" type="button" data-action="send" aria-label="Gửi yêu cầu" ${draft.trim()?'':'disabled'}>↑</button></div></div>${s.error?`<div class="error" role="alert">${esc(s.error)}</div>`:''}${isWelcome?'<p class="compose-hint">Bắt đầu bằng một câu bất kỳ. Factory sẽ chọn cách xử lý phù hợp.</p>':'<p class="compose-hint">Enter để gửi · Shift + Enter để xuống dòng · Chế độ mô phỏng</p>'}</div>`}
function messageBox(m){return `<article class="message"><span class="avatar ${m.role==='user'?'user':''}" aria-hidden="true">${m.role==='user'?'●':'✦'}</span><div class="bubble"><div class="speaker">${m.role==='user'?'Bạn':'Factory'}</div><div class="body ${m.role==='user'?'user-body':''}">${esc(m.content)}</div>${m.files?.length?`<div class="message-actions">${m.files.map(f=>`<span class="soft-tag">📎 ${esc(f)}</span>`).join('')}</div>`:''}${m.github?`<div class="message-actions"><span class="soft-tag">GitHub: ${esc(m.github)}</span></div>`:''}${m.childId?`<div class="message-actions"><button data-action="switch" data-id="${esc(m.childId)}" class="linkbutton">↗ Mở thread con · ${esc(find(m.childId)?.title||'Công việc')} · ${esc(find(m.childId)?.plan?.status==='done'?'Hoàn tất':find(m.childId)?.plan?.status==='running'?'Đang xử lý':'Đã tách')}</button></div>`:''}${m.simple?`<div class="message-actions"><button class="small-btn" data-action="branch-last">↗ Tách thành thread con</button></div>`:''}</div></article>`}
function offerBox(t){if(t.plan)return '';return `<div class="child-offer"><span class="offer-tag">${t.eligible?'Đề xuất Project':'Đề xuất xử lý'}</span><h3>${t.eligible?'Công việc này có thể trở thành một Project':'Tổ chức công việc thành kế hoạch riêng'}</h3><p>${t.eligible?'Bạn có thể tiếp tục làm rõ mục tiêu tại đây. Khi sẵn sàng, tạo Project và duyệt Execution Plan trước khi thực thi.':'Thread con giúp tách các bước và kết quả khỏi cuộc trò chuyện chính. Có thể lập kế hoạch mà không cần tạo Project.'}</p><div class="stack-buttons"><button class="primary" data-action="make-project">${t.eligible?'Tạo Project & Execution Plan':'Lập Execution Plan'} ↗</button><button class="secondary" data-action="main">Về thread chính</button></div></div>`}
function planBox(t){const p=t.plan,needed=p.monthly+p.once,ok=p.cap>=needed,run=p.status==='running',done=p.status==='done';return `<div class="plan-head"><div><h2>${p.isProject?'Project nháp':'Kế hoạch xử lý'} · Execution Plan</h2><p>${esc(t.title)} · Mọi giá trị bên dưới là dữ liệu minh họa</p></div><span class="plan-pill">${p.status==='draft'?'Chờ phê duyệt':done?'Đã mô phỏng xong':p.paused?'Tạm dừng':'Đang mô phỏng'}</span></div><div class="plan-grid"><div><section class="panel"><h3>6 bước thực thi</h3><div class="panel-body">${STEPS.map((st,i)=>`<div class="plan-step"><span class="n">${done||p.step>i?'✓':i+1}</span><div><b>${esc(st[0])}</b><small>${esc(st[1])}</small></div></div>`).join('')}</div></section><section class="panel"><h3>Tài nguyên dự kiến</h3><div class="panel-body"><div class="rowitem"><span>Mã nguồn</span><strong>${t.messages[0]?.github?'GitHub (đã đính kèm liên kết)':'Tạo mới / chưa xác định'}</strong></div><div class="rowitem"><span>Runtime</span><strong>Chưa lựa chọn</strong></div><div class="rowitem"><span>Database</span><strong>Chưa xác định</strong></div><div class="rowitem"><span>Credentials</span><strong>Chưa cấp quyền</strong></div></div></section></div><div><section class="panel"><h3>Ngân sách & phê duyệt</h3><div class="panel-body"><div class="big-num">$${needed.toFixed(2)} <span style="color:var(--muted);font-size:11px;font-weight:500">ước tính minh họa</span></div><div class="rowitem"><span>Phí thực thi (một lần)</span><strong>$${p.once.toFixed(2)}</strong></div><div class="rowitem"><span>Dự trù tháng đầu</span><strong>$${p.monthly.toFixed(2)}</strong></div><div class="budget-edit"><label for="budgetCap">Giới hạn ngân sách (USD)</label><input id="budgetCap" type="number" inputmode="decimal" min="0" max="100000" step="0.5" value="${p.cap}" ${p.status!=='draft'?'disabled':''}></div>${ok?'':`<div class="warning" role="alert">Cần tăng giới hạn hoặc giảm phạm vi trước khi phê duyệt.</div>`}<div class="note">${p.isProject?'Quyền GitHub, cloud và DNS sẽ phải được kiểm tra trước khi chạy thật.':'Việc thực thi thực tế cần được xác thực riêng.'}<br>Đây là bản mô phỏng; không gọi provider hoặc tạo tài nguyên.</div>${p.status==='draft'?`<label class="checkbox-line"><input type="checkbox" id="confirmApproval" ${p.confirmed?'checked':''}><span>Tôi đã xem kế hoạch và hiểu rằng thao tác này chỉ chạy mô phỏng.</span></label><div class="stack-buttons"><button class="primary" data-action="approve" ${!ok||!p.confirmed?'disabled':''}>Approve & Execute (Demo) →</button><button class="secondary" data-action="discuss">Trao đổi thêm</button></div>`:''}</div></section>${p.status!=='draft'?`<section class="panel"><h3>Theo dõi thực thi</h3><div class="panel-body"><div class="rowitem"><span>Tiến độ</span><strong>${p.step}/${STEPS.length} bước</strong></div><div class="progress"><div style="width:${Math.round(p.step/STEPS.length*100)}%"></div></div><div class="stack-buttons">${run?`<button class="primary" data-action="next-step" ${p.paused?'disabled':''}>Chạy bước tiếp →</button><button class="secondary" data-action="pause">${p.paused?'Tiếp tục':'Tạm dừng'}</button>`:''}${done?'<span class="plan-pill">✓ Hoàn tất mô phỏng</span>':''}</div><div style="margin-top:14px">${p.logs.map(line=>`<div class="log">${esc(line)}</div>`).join('')}</div></div></section>`:''}</div></div>`}
function appMarkup(){const t=thread(),welcome=t.kind==='main'&&t.messages.length===0;const child=t.kind==='child',showPlan=child&&t.plan&&t.tab==='plan';return `<div class="mobile-overlay ${s.drawer?'show':''}" data-action="close-drawer"></div><div class="shell"><aside class="sidebar ${s.drawer?'open':''}"><div class="brand"><span class="brand-logo">◈</span><span><b>Dark Software Factory</b><small>Conversation workspace</small></span></div><div><div class="nav-head"><span>Cuộc trò chuyện</span></div><button class="sidebtn ${s.active==='main'?'selected':''}" data-action="main"><span class="symbol">◉</span><span class="label">Thread chính</span></button>${s.threads.length>1?`<div class="side-sep"></div><div class="nav-head"><span>Thread con</span><span>${s.threads.length-1}</span></div><div class="subnav">${s.threads.filter(x=>x.kind==='child').map(x=>`<button class="sidebtn ${s.active===x.id?'selected':''}" data-action="switch" data-id="${esc(x.id)}"><span class="symbol">↳</span><span class="label">${esc(x.title)}</span>${x.plan?.status==='running'?'<span class="dot"></span>':''}</button>`).join('')}</div>`:''}</div><div class="sidebar-footer"><b>Prototype tương tác</b><br>Không có AI backend hoặc triển khai thật.<br><button class="small-btn" style="margin-top:10px" data-action="reset">↻ Bắt đầu lại</button></div></aside><main class="workspace"><header class="topbar"><div class="path"><button class="iconbtn menu-btn" data-action="menu" aria-label="Mở danh sách thread">☰</button><span class="path-sep">${child?'Thread chính /':'Workspace /'}</span><strong>${child?esc(t.title):'Cuộc trò chuyện'}</strong></div><div class="top-actions">${child?'<button class="outline-btn" data-action="main">← Thread chính</button>':'<span class="quiet-badge">Factory · Demo</span>'}</div></header>${child?`<div class="thread-bar"><div class="thread-title"><span>↳ ${esc(t.title)}</span></div><div class="tabs"><button data-action="tab" data-tab="chat" class="tab ${!showPlan?'current':''}">Thảo luận</button>${t.plan?`<button data-action="tab" data-tab="plan" class="tab ${showPlan?'current':''}">Execution Plan</button>`:''}</div></div>`:''}${showPlan?`<div class="stage plan-stage" id="scrollArea">${planBox(t)}</div>`:welcome?`<div class="stage" id="scrollArea"><div class="welcome"><h1>Bạn muốn điều gì?</h1>${composer(true)}</div></div>`:`<div class="stage" id="scrollArea"><div class="conversation">${t.messages.map(messageBox).join('')}${child?offerBox(t):''}</div></div><div class="sticky-composer">${composer(false)}</div>`}</main></div>`}
function render(){document.querySelector('#app').innerHTML=appMarkup();const area=document.querySelector('#scrollArea');if(area&&!document.querySelector('.welcome')&&!document.querySelector('.plan-stage'))area.scrollTop=area.scrollHeight;if(s.nextFocus){document.querySelector('#messageInput')?.focus({preventScroll:true});s.nextFocus=false}}
function switchTo(id){if(!find(id))return;s.active=id;s.error='';s.attachments=[];s.github='';s.githubOpen=false;s.drawer=false;save();render()}
function branchLast(){const main=find('main');const u=[...main.messages].reverse().find(m=>m.role==='user');if(!u)return;const c={id:id(),kind:'child',parent:'main',eligible:isProject(u.content),source:u.content,title:titleFrom(u.content),messages:[msg('user',u.content),msg('assistant','Đã mở thread con theo yêu cầu của bạn. Tại đây có thể thảo luận sâu hơn và lập kế hoạch độc lập.')],tab:'chat',plan:null};s.threads.push(c);main.messages.push(msg('assistant','Đã tách yêu cầu trước đó thành thread con.',{childId:c.id}));switchTo(c.id)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;const t=document.querySelector('#messageInput');if(t&&action!=='send'&&action!=='files'&&action!=='github')s.drafts[s.active]=t.value;
 switch(action){case 'send':send();return;case 'menu':s.drawer=true;render();return;case 'close-drawer':s.drawer=false;render();return;case 'main':switchTo('main');return;case 'switch':switchTo(b.dataset.id);return;case 'github':s.githubOpen=!s.githubOpen;s.error='';render();document.querySelector('#githubInput')?.focus();return;case 'files':document.querySelector('#filePicker')?.click();return;case 'remove-file':s.attachments.splice(Number(b.dataset.index),1);render();return;case 'make-project':addProject();return;case 'approve':approve();return;case 'next-step':nextStep();return;case 'pause':{const p=thread().plan;if(p&&p.status==='running'){p.paused=!p.paused;save();render()}return}case 'tab':thread().tab=b.dataset.tab;save();render();return;case 'discuss':thread().tab='chat';save();render();return;case 'branch-last':branchLast();return;case 'reset':if(confirm('Xóa các thread và bắt đầu lại bản mô phỏng?')){s=initial();save();render()}return;default:return}
});
document.addEventListener('input',e=>{if(e.target.id==='messageInput'){s.drafts[s.active]=e.target.value;const sendButton=document.querySelector('[data-action="send"]');if(sendButton)sendButton.disabled=!e.target.value.trim();e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,220)+'px'}else if(e.target.id==='githubInput'){s.github=e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='budgetCap'){const p=thread().plan;if(p&&p.status==='draft'){const cap=Number(e.target.value);p.cap=Number.isFinite(cap)&&cap>=0?cap:0;p.confirmed=false;save();render()}}else if(e.target.id==='confirmApproval'){const p=thread().plan;if(p){p.confirmed=e.target.checked;save();render()}}else if(e.target.id==='filePicker'){const valid=new Set(['txt','md','pdf','doc','docx','json','csv','png','jpg','jpeg','webp']);const incoming=Array.from(e.target.files||[]);for(const f of incoming){const ext=f.name.split('.').pop().toLowerCase();if(!valid.has(ext)||f.size>10*1024*1024){s.error='Chỉ hỗ trợ định dạng tài liệu/ảnh và tệp tối đa 10 MB.';continue}if(s.attachments.length<5)s.attachments.push({name:f.name,size:f.size})}e.target.value='';const text=document.querySelector('#messageInput')?.value||'';s.drafts[s.active]=text;render()}});
document.addEventListener('keydown',e=>{if(e.target.id==='messageInput'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
render();
})();
</script>
</body>
</html>
