<script>
(function(){
'use strict';
const T=window.THREE,host=document.getElementById('stage'),status=document.getElementById('runtime');
const errorBox=document.getElementById('error');
function fail(err){console.error('[Tokyo Diorama]',err);errorBox.hidden=false;errorBox.textContent='Không thể dựng mô hình 3D: '+String(err.stack||err)+'\nHãy kiểm tra WebGL, sau đó gửi nội dung chẩn đoán.';status.textContent='Lỗi WebGL';}
if(!T){fail('Không tải được assets/three.min.js');return;}
let renderer,scene,camera,hemi,sun,ambient,ground;
try{
  renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance',preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<650?1.4:1.8));
  renderer.shadowMap.enabled=innerWidth>750;renderer.shadowMap.type=T.PCFSoftShadowMap;
  renderer.setClearColor(0x000000,0);renderer.toneMapping=T.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.35;
  if('outputColorSpace' in renderer)renderer.outputColorSpace=T.SRGBColorSpace;else renderer.outputEncoding=T.sRGBEncoding;
  host.insertBefore(renderer.domElement,host.firstChild);
  scene=new T.Scene();camera=new T.PerspectiveCamera(38,1,.1,260);
  hemi=new T.HemisphereLight(0xeaf1ff,0xb68c80,2.15);scene.add(hemi);
  ambient=new T.AmbientLight(0xffeee2,.12);scene.add(ambient);
  sun=new T.DirectionalLight(0xffdbaf,3.15);sun.position.set(-22,40,32);sun.castShadow=renderer.shadowMap.enabled;
  sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-37;sun.shadow.camera.right=37;
  sun.shadow.camera.top=37;sun.shadow.camera.bottom=-37;sun.shadow.camera.near=1;sun.shadow.camera.far=110;sun.shadow.bias=-.0003;sun.shadow.normalBias=.03;scene.add(sun);
}catch(e){fail(e);return;}
// All geometry, signs and materials are original, generated inside this file.
const mats=new Map(),geos=new Map(),pickables=[],updaters=[],lit=[],world=new T.Group();scene.add(world);
let boxCount=0,night=false,spin=true,lastInteraction=0,frames=0,lastStats=performance.now();
function mat(hex,roughness=.79,emissive){let key=hex+'|'+roughness+'|'+(emissive||'');if(!mats.has(key))mats.set(key,new T.MeshStandardMaterial({color:hex,roughness,metalness:.03,emissive:emissive||0x000000,emissiveIntensity:emissive?.42:0}));return mats.get(key);}
function cube(p,w,h,d,x,y,z,c,cast=false){let key=[w,h,d].join(',');if(!geos.has(key))geos.set(key,new T.BoxGeometry(w,h,d));let m=new T.Mesh(geos.get(key),typeof c==='string'?mat(c):c);m.position.set(x,y,z);m.receiveShadow=true;m.castShadow=cast&&renderer.shadowMap.enabled;p.add(m);boxCount++;return m;}
function ball(p,r,x,y,z,color,sx=1,sy=1,sz=1){let key='s'+r;if(!geos.has(key))geos.set(key,new T.SphereGeometry(r,14,11));let b=new T.Mesh(geos.get(key),mat(color));b.position.set(x,y,z);b.scale.set(sx,sy,sz);b.castShadow=renderer.shadowMap.enabled;p.add(b);return b;}
function cyl(p,rt,rb,h,x,y,z,color,sides=12){let key='c'+[rt,rb,h,sides].join(',');if(!geos.has(key))geos.set(key,new T.CylinderGeometry(rt,rb,h,sides));let b=new T.Mesh(geos.get(key),mat(color));b.position.set(x,y,z);b.castShadow=h>1&&renderer.shadowMap.enabled;p.add(b);return b;}
function sign(p,word,w,h,x,y,z,rot=0,back='#52636b',ink='#fff2d9',edge='#b88b68',glow=false){
 let cvs=document.createElement('canvas');cvs.width=512;cvs.height=256;let c=cvs.getContext('2d');
 c.fillStyle=edge;c.fillRect(0,0,512,256);c.fillStyle=back;c.fillRect(13,13,486,230);
 c.fillStyle='rgba(255,255,255,.10)';c.fillRect(25,22,459,9);c.textAlign='center';c.textBaseline='middle';c.fillStyle=ink;
 let size=word.length>12?40:word.length>8?52:word.length>5?68:word.length>3?86:110;
 c.font='800 '+size+'px sans-serif';c.fillText(word,256,137,466);
 const tex=new T.CanvasTexture(cvs);tex.anisotropy=2;if('colorSpace' in tex)tex.colorSpace=T.SRGBColorSpace;
 const mesh=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex,side:T.DoubleSide,transparent:false,toneMapped:!glow}));
 mesh.position.set(x,y,z);mesh.rotation.y=rot;p.add(mesh);return mesh;
}
function info(mesh,name,category,desc){mesh.userData.point={name,category,desc};pickables.push(mesh);return mesh;}
function roof(p,w,d,x,y,z,color,rise=.95){
 const shape=new T.Shape();shape.moveTo(-w/2,0);shape.lineTo(0,rise);shape.lineTo(w/2,0);shape.closePath();
 const geo=new T.ExtrudeGeometry(shape,{depth:d,bevelEnabled:false});geo.translate(0,0,-d/2);
 let mesh=new T.Mesh(geo,mat(color));mesh.position.set(x,y,z);mesh.castShadow=renderer.shadowMap.enabled;mesh.receiveShadow=true;p.add(mesh);
 cube(p,w+.45,.16,d+.25,x,y-.015,z,color);
 for(let i=0;i<9;i++){
   const zz=z-d/2+(i+.4)*d/9;
   let v=cube(p,w+.34,.065,.09,x,y+.01,zz,'#836c69');v.rotation.z=0;
 }
 return mesh;
}
function windowFront(p,x,y,z,w=1.2,h=1.24,glow=false){
 cube(p,w+.18,h+.2,.14,x,y,z,'#684f46');cube(p,w,h,.16,x,y,z+.09,glow?'#ffe0a4':'#678387');
 cube(p,.08,h+.07,.2,x,y,z+.18,'#b79b7a');cube(p,w+.15,.11,.28,x,y-h/2,z+.17,'#c5a88a');
 if(glow)cube(p,w-.08,.09,.04,x,y-h/2+.2,z+.22,'#e5c58a');
}
function windowSide(p,x,y,z){
 const g=new T.Group();g.position.set(x,y,z);g.rotation.y=Math.PI/2;p.add(g);windowFront(g,0,0,0,.83,.9);
}
function awning(p,width,z,y,scheme){
 let count=8,band=width/count;
 for(let i=0;i<count;i++)cube(p,band+.02,.14,1.23,-width/2+band*(i+.5),y,z+.48,i%2?scheme:'#efe5d0');
 cube(p,width+.2,.15,.16,0,y-.17,z+1.04,'#a99177');
}
function lantern(p,x,y,z,label='福'){
 cyl(p,.29,.3,.57,x,y,z,'#d37f63',12);cube(p,.38,.08,.38,x,y+.31,z,'#5b484b');cube(p,.38,.08,.38,x,y-.30,z,'#5b484b');
 sign(p,label,.42,.35,x,y,z+.3,0,'#d77f63','#fff8d7','#d77f63',true);
 lit.push({obj:ball(p,.11,x,y,z+.28,'#f4ba80')});
}
function plant(p,x,z,s=1){
 const a=new T.Group();a.position.set(x,0,z);a.scale.setScalar(s);p.add(a);
 cyl(a,.29,.22,.5,0,.28,0,'#9e7063');cyl(a,.08,.11,.72,0,.83,0,'#7c7053');
 ball(a,.55,0,1.18,0,'#678b69',1,.75,.8);ball(a,.43,.34,1.23,.08,'#799a6d');ball(a,.33,-.3,1.28,.1,'#6d9e73');return a;
}
function ac(p,x,y,z){
 cube(p,1.2,.66,.45,x,y,z,'#c1c2b8');cube(p,.56,.52,.02,x,y,z+.24,'#7a898b');
 for(let t=-1;t<=1;t++)cube(p,.035,.5,.05,x+t*.17,y,z+.27,'#bac6c2');
 cube(p,1.32,.11,.52,x,y-.4,z,'#80685e');
}
function addBuilding(name,cfg){
 const {x,z,w,d,h,wall,frame,roofColor,logo,signColor,accent,levels}=cfg;let g=new T.Group();g.position.set(x,0,z);world.add(g);
 cube(g,w,h,d,0,h/2,0,wall,true);cube(g,w+.16,.19,d+.16,0,.13,0,'#ab8c79');
 const front=d/2+.085;
 // Architectural layers, uneven timber and story bands.
 for(let k=1;k<levels;k++){
   let yy=h*k/levels;
   cube(g,w+.2,.18,d+.18,0,yy,0,frame);
   cube(g,w+.32,.22,.55,0,yy+.02,front+.16,accent);
   cube(g,w+.36,.13,.58,0,yy+.28,front+.13,roofColor);
 }
 for(let col=-1;col<=1;col++){
   const xx=col*(w*.33);
   cube(g,.13,h-.32,.25,xx,h/2,front+.04,frame);
 }
 // Window grids only on upper levels, avoid excessively uniform repetition.
 for(let floor=1;floor<levels;floor++){
   const yy=h*(floor+.45)/levels;
   for(let col=-1;col<=1;col++)windowFront(g,col*w*.29,yy,front,w*.21,1.25,(col+floor)%4===0);
   cube(g,w*.75,.13,.65,0,yy-.89,front+.24,'#85675b');
   for(let col=-1;col<=1;col++)cube(g,.11,.64,.12,col*w*.30,yy-.53,front+.58,'#684e4a');
 }
 // Shop ground floor: glowing interior, timber sliding doors, shop banner and canopy.
 cube(g,w-.55,2.22,.16,0,1.26,front,'#3d4b4d');cube(g,w-.74,1.96,.19,0,1.25,front+.11,'#9bb0a4');
 for(let col=-2;col<=2;col++)cube(g,.12,2.0,.23,col*(w-.8)/5,1.26,front+.23,'#71564a');
 cube(g,w+.2,.35,.9,0,2.5,front+.42,accent);awning(g,w-.3,front+.75,2.27,signColor);
 sign(g,logo,Math.min(w*.8,4.1),.76,0,2.92,front+.56,0,signColor,'#fce8c5','#bb906c',true);
 for(let i=-1;i<=1;i+=2){lantern(g,i*w*.35,2.2,front+1.14,i<0?'福':'店');}
 if(levels>=3)roof(g,w+.45,d+.4,0,h+.11,0,roofColor,.75);
 else roof(g,w+.35,d+.3,0,h+.1,0,roofColor,1.10);
 // Roof tiles and utility stacks in silhouette.
 for(let k=0;k<3;k++){
  cube(g,.36,.3,.45,-w*.3+k*w*.30,h+.92,.05,'#876e67');
 }
 for(let side=-1;side<=1;side+=2){
  windowSide(g,side*(w/2+.08),h*.57,-d*.15);
  windowSide(g,side*(w/2+.08),h*.77,d*.2);
 }
 if(cfg.special==='left'){
   // Rooftop house extension, eaves, slatted balcony.
   cube(g,w*.53,2.15,d*.56,-w*.15,h+1.1,-d*.2,'#96735f',true);
   roof(g,w*.57,d*.60,-w*.15,h+2.22,-d*.2,'#754c43',1.2);
   for(let i=-2;i<=2;i++)cube(g,.11,1.06,.12,i*.57,h*.67,front+.81,'#634b42');
   ac(g,w*.25,h*.68,front+.26);
 }
 if(cfg.special==='center'){
   // Towered upper facade with projecting vertical sign and roof parapet.
   cube(g,w*.55,2.0,d*.43,w*.13,h+1.0,-d*.20,'#b78e76',true);
   roof(g,w*.57,d*.49,w*.13,h+2.1,-d*.2,'#925f50',.87);
   sign(g,'山の湯',.9,2.45,w/2+.27,h*.70,front+.52,Math.PI/2,'#455f62','#fff3d7','#c49c70',true);
   cube(g,.30,1.1,.29,w/2+.1,h*.65,front+.08,'#b7a6a0');
 }
 if(cfg.special==='right'){
   cube(g,w*.6,2.4,d*.53,-w*.12,h+1.2,-d*.12,'#b5a084',true);
   roof(g,w*.66,d*.58,-w*.12,h+2.47,-d*.12,'#5b595b',.65);
   ac(g,-w*.22,h*.62,front+.32);
 }
 const proxy=cube(g,w,h*.89,d,0,h*.51,0,mat(wall));proxy.visible=false;
 // Invisible helper for ray-casting; keep raycasts on visible body instead.
 const body=g.children.find(o=>o.isMesh&&o.visible&&o.geometry.type==='BoxGeometry');
 info(body||g,name,'TOKYO / ARCHITECTURE',cfg.desc);
 return g;
}
// A precise floating street-corner footprint, not a repeated city grid.
cube(world,35,.68,25,0,-.65,0,'#81676d',true);
cube(world,34.6,.16,24.6,0,-.22,0,'#af9a87');
cube(world,34.2,.14,24.0,0,-.11,0,'#847771');
cube(world,34.4,.14,7.7,0,-.01,8.25,'#46464e');
cube(world,3.9,.15,24.0,15.1,-.01,0,'#46464e');
// Curbs, paving slabs, rails and painted Japanese street markings.
cube(world,34.5,.18,1.13,0,.13,4.25,'#b7a897');
cube(world,1.1,.18,23.5,12.65,.13,0,'#b7a897');
for(let i=-16;i<=16;i+=1.3)cube(world,.045,.014,1.05,i,.238,4.24,'#9e8b7c');
for(let i=-9;i<=9;i+=1.3)cube(world,1.05,.015,.045,12.65,.238,i,'#9e8b7c');
for(let z=6.65;z<=9.7;z+=1.85)cube(world,32,.016,.075,0,.085,z,'#8f8a83');

let last=performance.now(),t=0;resize();
function animate(now){requestAnimationFrame(animate);if(document.hidden){last=now;return;}
 let dt=Math.min(.05,(now-last)/1000);last=now;
 if(spin&&now-lastInteraction>6500)ideal.yaw+=dt*.045;
 t+=dt;updaters.forEach(f=>f(t));updateCamera(dt);
 try{renderer.render(scene,camera);}catch(e){fail(e);return;}
 frames++;
 if(now-lastStats>1300){let fps=Math.round(frames*1000/(now-lastStats));status.textContent=`3D live · ${fps} FPS`;
 const dbg=document.getElementById('debug');dbg.textContent=`Three.js r${T.REVISION}\n${width} × ${height} px\n${fps} FPS\n${renderer.info.render.calls} draw calls\n${renderer.info.render.triangles} triangles\n${boxCount} structural boxes\nNight: ${night}\nOrbit: ${spin}\nWebGL: ${renderer.capabilities.isWebGL2?'2':'1'}\nSource: original procedural geometry`;
 frames=0;lastStats=now;}
}
requestAnimationFrame(animate);
})();
