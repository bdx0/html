name: Deploy HTML Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website and page catalog
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='scripts/' --exclude='_catalog.json' --exclude='README.md' ./ _site/
          python3 bo-ho-ben-tre/scripts/build.py --osm --output _site/bo-ho-ben-tre/data
          test -s _site/bo-ho-ben-tre/data/catalog.sqlite
          test -s _site/bo-ho-ben-tre/data/scene.json
          test -s _site/bo-ho-ben-tre/data/sqlite-explorer.json
          test -s _site/bo-ho-ben-tre/data/model-view.json
          test -s _site/bo-ho-ben-tre/model.html
          test -s _site/bo-ho-ben-tre/sqlite.html
          python3 scripts/build_catalog.py --root . --output _site/catalog.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/catalog.json

      - name: Prepare Python for open imagery raster build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build licensed local open imagery (OAM preferred, Sentinel fallback)
        # Output is deployed on GitHub Pages; no Google/Esri tiles or API keys.
        # The original manifest is retained when remote imagery is unavailable.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          if python3 -m pip install --quiet 'rasterio>=1.4,<2' 'numpy>=1.26,<3' 'Pillow>=10,<13' 'requests>=2.31,<3'; then
            python3 bo-ho-ben-tre/scripts/build_open_imagery.py --output _site/bo-ho-ben-tre/data/imagery || echo 'Open imagery build was unavailable; OSM technical Floor Plan remains.'
          else
            echo 'Imagery dependencies unavailable; deploy technical OSM base.'
          fi
          test -s _site/bo-ho-ben-tre/data/imagery/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
