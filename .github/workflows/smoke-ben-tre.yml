name: Smoke test Bờ Hồ Bến Tre 3D
on:
  push:
    branches: [main]
    paths:
      - "bo-ho-ben-tre/**"
      - "scripts/test_ben_tre.mjs"
      - ".github/workflows/smoke-ben-tre.yml"
      - "assets/three.min.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Export SQLite explorer snapshot for browser
        run: python3 bo-ho-ben-tre/scripts/build.py --osm
      - name: Validate modeled-data graph and lake evidence
        run: |
          python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          p=Path('bo-ho-ben-tre/data')
          m=json.loads((p/'model-view.json').read_text())
          db=sqlite3.connect(p/'catalog.sqlite')
          for table,number in m['table_counts'].items():
              assert db.execute('SELECT COUNT(*) FROM "'+table+'"').fetchone()[0] == number, table
          assert m['lake_audit']['verified_corrections']==0
          assert m['lake_audit']['status']=='conflict_unresolved'
          ids={n['id'] for n in m['nodes']}
          assert len(ids)==len(m['nodes'])
          for n in m['nodes']:
              for e in n['relations']: assert e['target'] in ids
          print('Verified modeled entities:',len(ids),'relations:',sum(len(n['relations']) for n in m['nodes']))
          PY
      - name: Run browser test for desktop and mobile
        run: node scripts/test_ben_tre.mjs
      - name: Archive screenshots and diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ben-tre-3d-smoke
          path: |
            ben-tre-*.png
            ben-tre-smoke-report.json
          if-no-files-found: warn
