name: Smoke test Ho Truc Giang Diorama
on:
  push:
    branches: [main]
    paths:
      - 'ho-truc-giang-diorama.html'
      - 'assets/miniworld.js'
      - 'assets/three.min.js'
      - 'scripts/test_truc_giang_diorama.mjs'
      - '.github/workflows/smoke-truc-giang-diorama.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test real WebGL, geometry and controls at 3 viewport sizes
        run: node scripts/test_truc_giang_diorama.mjs
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ho-truc-giang-diorama-qa
          path: |
            truc-giang-diorama-*.png
            truc-giang-diorama-smoke.json
          if-no-files-found: ignore
